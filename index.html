<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbeitszeit</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1a1c1e;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-2: #16a34a;
    --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --card-bg: #212327;
      --text: #f1f2f4;
      --muted: #9aa0a8;
      --border: #33363b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px 16px 64px;
  }
  .app {
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 20px;
    text-align: center;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 {
    margin: 0 0 14px;
    font-size: 1rem;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 12px;
  }
  input[type="time"],
  input[type="number"] {
    width: 100%;
    margin-top: 4px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
  }
  fieldset {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin: 0 0 12px;
  }
  legend {
    font-size: 0.85rem;
    color: var(--muted);
    padding: 0 4px;
  }
  .radio-row {
    display: flex;
    gap: 16px;
    margin-bottom: 10px;
    font-size: 0.9rem;
  }
  .radio-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    color: var(--text);
  }
  .radio-row input { width: auto; margin: 0; }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button.secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    margin-top: 8px;
    font-weight: 500;
  }
  .big-timer {
    font-size: 2.6rem;
    font-weight: 700;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .big-timer.done { color: var(--accent-2); }
  .big-money {
    font-size: 2.2rem;
    font-weight: 700;
    text-align: center;
    color: var(--accent-2);
    font-variant-numeric: tabular-nums;
  }
  .sub {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 6px;
  }
  .progress {
    margin-top: 16px;
    height: 8px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>⏱️ Arbeitszeit</h1>

    <section class="card" id="setupCard">
      <h2>Einstellungen</h2>
      <label>Arbeitsbeginn
        <input type="time" id="startTime">
      </label>
      <label>Arbeitsdauer (Stunden, ohne Pause)
        <input type="number" id="duration" step="0.25" min="0" value="8">
      </label>
      <fieldset>
        <legend>Pause</legend>
        <label>Pause ab
          <input type="time" id="breakStart" value="12:00">
        </label>
        <label>Pausendauer (Minuten)
          <input type="number" id="breakMinutes" min="0" step="5" value="30">
        </label>
      </fieldset>
      <fieldset>
        <legend>Gehalt</legend>
        <div class="radio-row">
          <label><input type="radio" name="salaryType" value="monthly" checked> Monatsgehalt</label>
          <label><input type="radio" name="salaryType" value="yearly"> Jahresgehalt</label>
        </div>
        <label>Betrag (€ brutto)
          <input type="number" id="salaryAmount" min="0" step="10" placeholder="z.B. 3500">
        </label>
        <label>Vertragliche Wochenstunden
          <input type="number" id="weeklyHours" min="1" step="0.5" value="40">
        </label>
      </fieldset>
      <button id="saveBtn">Speichern & Starten</button>
    </section>

    <section class="card" id="statusCard" hidden>
      <h2>Bis Feierabend</h2>
      <div class="big-timer" id="countdown">--:--:--</div>
      <div class="sub">Feierabend um <span id="feierabendTime"></span> Uhr (inkl. Pause)</div>
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    </section>

    <section class="card" id="earningsCard" hidden>
      <h2>Verdienst heute</h2>
      <div class="big-money" id="earnedAmount">0,00 €</div>
      <div class="sub">Stundenlohn: <span id="hourlyRate">–</span> €/h</div>
    </section>

    <button class="secondary" id="editBtn" hidden>Einstellungen bearbeiten</button>
  </div>

<script>
  const STORAGE_KEY = 'arbeitszeitState';

  const els = {
    setupCard: document.getElementById('setupCard'),
    statusCard: document.getElementById('statusCard'),
    earningsCard: document.getElementById('earningsCard'),
    editBtn: document.getElementById('editBtn'),
    saveBtn: document.getElementById('saveBtn'),
    startTime: document.getElementById('startTime'),
    duration: document.getElementById('duration'),
    breakStart: document.getElementById('breakStart'),
    breakMinutes: document.getElementById('breakMinutes'),
    salaryAmount: document.getElementById('salaryAmount'),
    weeklyHours: document.getElementById('weeklyHours'),
    countdown: document.getElementById('countdown'),
    feierabendTime: document.getElementById('feierabendTime'),
    progressFill: document.getElementById('progressFill'),
    earnedAmount: document.getElementById('earnedAmount'),
    hourlyRate: document.getElementById('hourlyRate'),
  };

  let interval = null;

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const state = JSON.parse(raw);
      if (!state.breakStart) state.breakStart = '12:00';
      if (state.breakMinutes === undefined || state.breakMinutes === null) state.breakMinutes = 30;
      return state;
    } catch (e) {
      return null;
    }
  }

  function saveState(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function getSalaryType() {
    return document.querySelector('input[name="salaryType"]:checked').value;
  }

  function setSalaryType(type) {
    document.querySelector(`input[name="salaryType"][value="${type}"]`).checked = true;
  }

  function hourlyRateFor(state) {
    const amount = parseFloat(state.salaryAmount) || 0;
    const weeklyHours = parseFloat(state.weeklyHours) || 1;
    if (state.salaryType === 'yearly') {
      return amount / (weeklyHours * 52);
    }
    return amount / (weeklyHours * 4.33);
  }

  function getStartDate(startTimeStr) {
    const [h, m] = startTimeStr.split(':').map(Number);
    const d = new Date();
    d.setHours(h, m, 0, 0);
    return d;
  }

  function formatDuration(ms) {
    const totalSeconds = Math.max(0, Math.floor(ms / 1000));
    const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
    const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
    const s = String(totalSeconds % 60).padStart(2, '0');
    return `${h}:${m}:${s}`;
  }

  function formatMoney(value) {
    return value.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
  }

  function tick(state) {
    const now = new Date();
    const start = getStartDate(state.startTime);
    const durationMs = parseFloat(state.duration) * 3600000;
    const breakMs = (parseFloat(state.breakMinutes) || 0) * 60000;

    let breakStart = getStartDate(state.breakStart);
    if (breakStart < start) breakStart = new Date(start.getTime());
    const breakEnd = new Date(breakStart.getTime() + breakMs);

    const feierabend = new Date(start.getTime() + durationMs + breakMs);

    const remaining = feierabend - now;
    els.countdown.textContent = remaining > 0 ? formatDuration(remaining) : 'Feierabend! 🎉';
    els.countdown.classList.toggle('done', remaining <= 0);
    els.feierabendTime.textContent = feierabend.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

    const totalWindowMs = durationMs + breakMs;
    const rawElapsedMs = Math.min(Math.max(now - start, 0), totalWindowMs);
    const progressPct = totalWindowMs > 0 ? (rawElapsedMs / totalWindowMs) * 100 : 0;
    els.progressFill.style.width = progressPct + '%';

    // Gearbeitete Zeit ohne Pause (für den Verdienst)
    let workedMs;
    if (now <= breakStart) {
      workedMs = Math.max(now - start, 0);
    } else if (now < breakEnd) {
      workedMs = breakStart - start;
    } else {
      workedMs = (now - start) - breakMs;
    }
    workedMs = Math.min(Math.max(workedMs, 0), durationMs);

    const inBreak = now > breakStart && now < breakEnd && remaining > 0;
    els.earningsCard.querySelector('.break-note')?.remove();
    if (inBreak) {
      const note = document.createElement('div');
      note.className = 'sub break-note';
      note.textContent = 'Pause läuft – kein Verdienst';
      els.earnedAmount.insertAdjacentElement('afterend', note);
    }

    const rate = hourlyRateFor(state);
    const earned = rate * (workedMs / 3600000);
    els.earnedAmount.textContent = formatMoney(earned);
    els.hourlyRate.textContent = rate.toFixed(2);
  }

  function startTracking(state) {
    els.setupCard.hidden = true;
    els.statusCard.hidden = false;
    els.earningsCard.hidden = false;
    els.editBtn.hidden = false;

    if (interval) clearInterval(interval);
    tick(state);
    interval = setInterval(() => tick(state), 1000);
  }

  function showSetup(state) {
    if (interval) clearInterval(interval);
    els.setupCard.hidden = false;
    els.statusCard.hidden = true;
    els.earningsCard.hidden = true;
    els.editBtn.hidden = true;

    if (state) {
      els.startTime.value = state.startTime;
      els.duration.value = state.duration;
      els.breakStart.value = state.breakStart;
      els.breakMinutes.value = state.breakMinutes;
      els.salaryAmount.value = state.salaryAmount;
      els.weeklyHours.value = state.weeklyHours;
      setSalaryType(state.salaryType);
    }
  }

  els.saveBtn.addEventListener('click', () => {
    if (!els.startTime.value) {
      els.startTime.focus();
      return;
    }
    const state = {
      startTime: els.startTime.value,
      duration: parseFloat(els.duration.value) || 0,
      breakStart: els.breakStart.value || els.startTime.value,
      breakMinutes: parseFloat(els.breakMinutes.value) || 0,
      salaryType: getSalaryType(),
      salaryAmount: parseFloat(els.salaryAmount.value) || 0,
      weeklyHours: parseFloat(els.weeklyHours.value) || 1,
    };
    saveState(state);
    startTracking(state);
  });

  els.editBtn.addEventListener('click', () => {
    const state = loadState();
    showSetup(state);
  });

  // Init
  const existing = loadState();
  if (existing) {
    els.startTime.value = existing.startTime;
    els.duration.value = existing.duration;
    els.breakStart.value = existing.breakStart || '12:00';
    els.breakMinutes.value = existing.breakMinutes ?? 30;
    els.salaryAmount.value = existing.salaryAmount;
    els.weeklyHours.value = existing.weeklyHours;
    setSalaryType(existing.salaryType);
    startTracking(existing);
  } else {
    const now = new Date();
    els.startTime.value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  }
</script>
</body>
</html>
